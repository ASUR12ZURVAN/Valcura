<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics Dashboard</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #f4f7f6; margin: 0; padding: 0; }
        .container { max-width: 1000px; margin: 50px auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1, h2 { color: #333; }
        
        /* Login Form */
        #login-section { text-align: center; max-width: 400px; margin: 0 auto; }
        input[type="text"], input[type="password"] { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background: #007bff; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-size: 16px; width: 100%; }
        button:hover { background: #0056b3; }
        .error { color: red; margin-top: 10px; display: none; }
        
        /* Dashboard */
        #dashboard-section { display: none; }
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: #eef2f5; padding: 20px; border-radius: 8px; text-align: center; }
        .stat-card h3 { margin: 0 0 10px 0; color: #555; font-size: 16px; }
        .stat-card p { margin: 0; font-size: 28px; font-weight: bold; color: #007bff; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: #f8f9fa; color: #333; }
        .badge { display: inline-block; padding: 4px 8px; border-radius: 12px; font-size: 12px; font-weight: bold; }
        .badge-missed { background: #ffebee; color: #c62828; }
        .badge-text { background: #e8f5e9; color: #2e7d32; }
        
        .logout-btn { background: #dc3545; width: auto; float: right; }
        .logout-btn:hover { background: #c82333; }
    </style>
</head>
<body>
    <div class="container">
        
        <!-- Login Section -->
        <div id="login-section">
            <h1>Login</h1>
            <p>Please log in to view the dashboard.</p>
            <form id="login-form">
                <input type="text" id="username" placeholder="Username" required>
                <input type="password" id="password" placeholder="Password" required>
                <button type="submit">Login</button>
                <div id="login-error" class="error">Invalid username or password.</div>
            </form>
        </div>

        <!-- Dashboard Section -->
        <div id="dashboard-section">
            <button id="logout-btn" class="logout-btn">Logout</button>
            <h1>Analytics Dashboard</h1>
            
            <div class="stats-grid">
                <div class="stat-card">
                    <h3>Total Interactions</h3>
                    <p id="stat-total">0</p>
                </div>
                <div class="stat-card">
                    <h3>Missed Calls</h3>
                    <p id="stat-missed">0</p>
                </div>
                <div class="stat-card">
                    <h3>WhatsApp Texts</h3>
                    <p id="stat-whatsapp">0</p>
                </div>
            </div>

            <h2>Message History</h2>
            <table>
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Phone Number</th>
                        <th>Type</th>
                        <th>User Message</th>
                        <th>AI Response</th>
                    </tr>
                </thead>
                <tbody id="messages-tbody">
                    <!-- Messages will be injected here -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const loginSection = document.getElementById('login-section');
            const dashboardSection = document.getElementById('dashboard-section');
            const loginForm = document.getElementById('login-form');
            const loginError = document.getElementById('login-error');
            const logoutBtn = document.getElementById('logout-btn');

            // Check if user is already logged in
            const token = localStorage.getItem('access_token');
            if (token) {
                showDashboard();
                fetchData();
            }

            // Handle Login
            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                loginError.style.display = 'none';
                
                const username = document.getElementById('username').value;
                const password = document.getElementById('password').value;

                try {
                    const response = await fetch('/api/token/', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username, password })
                    });

                    if (response.ok) {
                        const data = await response.json();
                        localStorage.setItem('access_token', data.access);
                        localStorage.setItem('refresh_token', data.refresh);
                        showDashboard();
                        fetchData();
                    } else {
                        loginError.style.display = 'block';
                    }
                } catch (error) {
                    console.error('Login Error:', error);
                    loginError.style.display = 'block';
                }
            });

            // Handle Logout
            logoutBtn.addEventListener('click', () => {
                localStorage.removeItem('access_token');
                localStorage.removeItem('refresh_token');
                loginSection.style.display = 'block';
                dashboardSection.style.display = 'none';
                loginForm.reset();
            });

            function showDashboard() {
                loginSection.style.display = 'none';
                dashboardSection.style.display = 'block';
            }

            // Fetch Dashboard Data
            async function fetchData() {
                const token = localStorage.getItem('access_token');
                if (!token) return;

                try {
                    const response = await fetch('/api/messages/', {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });

                    if (response.status === 401) {
                        // Token might be expired, a real app would try to use refresh_token here
                        logoutBtn.click();
                        return;
                    }

                    if (response.ok) {
                        const data = await response.json();
                        updateDashboardUI(data);
                    }
                } catch (error) {
                    console.error('Fetch Error:', error);
                }
            }

            function updateDashboardUI(data) {
                // Update stats
                document.getElementById('stat-total').innerText = data.analytics.total_messages;
                document.getElementById('stat-missed').innerText = data.analytics.missed_calls;
                document.getElementById('stat-whatsapp').innerText = data.analytics.whatsapp_messages;

                // Update table
                const tbody = document.getElementById('messages-tbody');
                tbody.innerHTML = '';
                
                data.messages.forEach(msg => {
                    const date = new Date(msg.created_at).toLocaleString();
                    const badgeClass = msg.is_missed_call ? 'badge-missed' : 'badge-text';
                    const typeLabel = msg.is_missed_call ? 'Missed Call' : 'WhatsApp Text';
                    
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${date}</td>
                        <td>${msg.phone_number}</td>
                        <td><span class="badge ${badgeClass}">${typeLabel}</span></td>
                        <td>${msg.user_message || '-'}</td>
                        <td>${msg.ai_response}</td>
                    `;
                    tbody.appendChild(tr);
                });
            }
        });
    </script>
</body>
</html>
